name: personal-portfolio
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio_app
      POSTGRES_PASSWORD: ${PORTFOLIO_POSTGRES_PASSWORD:?Set a unique local PORTFOLIO_POSTGRES_PASSWORD}
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["portfolio-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U portfolio_app -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  portfolio-postgres: {}
