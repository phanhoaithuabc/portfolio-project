version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/apps/portfolio"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/ci/jenkins"
    schedule:
      interval: "weekly"
  - package-ecosystem: "terraform"
    directory: "/infra/aws"
    schedule:
      interval: "weekly"
  - package-ecosystem: "terraform"
    directory: "/infra/aws-media"
    schedule:
      interval: "weekly"
  - package-ecosystem: "terraform"
    directory: "/infra/azure"
    schedule:
      interval: "weekly"
  - package-ecosystem: "terraform"
    directory: "/infra/gcp"
    schedule:
      interval: "weekly"
