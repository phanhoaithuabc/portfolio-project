apiVersion: v1
kind: Service
metadata: { name: postgres, labels: { app.kubernetes.io/part-of: portfolio } }
spec:
  selector: { app: portfolio-postgres }
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: portfolio-postgres, labels: { app.kubernetes.io/part-of: portfolio } }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: portfolio-postgres } }
  template:
    metadata:
      labels: { app: portfolio-postgres, app.kubernetes.io/part-of: portfolio, team: portfolio }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: postgres
          image: {{ .Values.image | quote }}
          args: [-c, max_connections=30, -c, shared_buffers=64MB]
          env:
            - { name: POSTGRES_DB, value: {{ .Values.database | quote }} }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          envFrom: [{ secretRef: { name: {{ .Values.credentialsSecret }} } }]
          ports: [{ name: postgres, containerPort: 5432 }]
          resources: {{ toYaml .Values.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          startupProbe: { exec: { command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'] }, periodSeconds: 5, failureThreshold: 30 }
          readinessProbe: { exec: { command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'] }, periodSeconds: 5 }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.storageClass }}
        resources: { requests: { storage: {{ .Values.storage }} } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: portfolio-database-isolation }
spec:
  podSelector: { matchLabels: { app: portfolio-postgres } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Values.applicationNamespace }} } }
          podSelector: { matchLabels: { app: portfolio-api } }
      ports: [{ port: 5432, protocol: TCP }]
  egress:
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } } }]
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]