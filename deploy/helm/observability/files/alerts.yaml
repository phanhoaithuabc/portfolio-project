groups:
  - name: portfolio-api
    rules:
      - alert: PortfolioApiErrors
        expr: sum(rate(portfolio_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(portfolio_http_requests_total[5m])), 0.001) > 0.025
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: Portfolio API error rate exceeds 2.5 percent
          runbook: docs/runbooks/incidents.md
      - alert: PortfolioApiLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(portfolio_http_duration_seconds_bucket[5m]))) > 2
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: Portfolio API p95 latency exceeds two seconds
          runbook: docs/runbooks/incidents.md
      - alert: PortfolioApiDown
        expr: up{job="portfolio"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: Portfolio API metrics target is unreachable
          runbook: docs/runbooks/incidents.md
