apiVersion: v1
kind: ServiceAccount
metadata: { name: kube-state-metrics }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: portfolio-kube-state-metrics }
rules:
  - { apiGroups: [""], resources: [pods, namespaces], verbs: [list, watch] }
  - { apiGroups: [apps], resources: [deployments], verbs: [list, watch] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: portfolio-kube-state-metrics }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: portfolio-kube-state-metrics }
subjects: [{ kind: ServiceAccount, name: kube-state-metrics, namespace: {{ .Release.Namespace }} }]
---
apiVersion: v1
kind: Service
metadata: { name: kube-state-metrics }
spec:
  selector: { app: kube-state-metrics }
  ports: [{ name: http, port: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: kube-state-metrics }
spec:
  replicas: 1
  selector: { matchLabels: { app: kube-state-metrics } }
  template:
    metadata: { labels: { app: kube-state-metrics } }
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.15.0
          args: ["--resources=pods,deployments,namespaces", "--metric-labels-allowlist=pods=[app,team,environment]"]
          ports: [{ containerPort: 8080 }]
          resources: { requests: { cpu: 25m, memory: 48Mi }, limits: { cpu: 250m, memory: 128Mi } }