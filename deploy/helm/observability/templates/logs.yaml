{{- if .Values.logs.enabled }}
apiVersion: v1
kind: ConfigMap
metadata: { name: loki-config }
data:
  config.yaml: |
    auth_enabled: false
    server: { http_listen_port: 3100 }
    common:
      path_prefix: /loki
      replication_factor: 1
      ring: { kvstore: { store: inmemory } }
      storage: { filesystem: { chunks_directory: /loki/chunks, rules_directory: /loki/rules } }
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index: { prefix: index_, period: 24h }
    compactor: { working_directory: /loki/compactor, retention_enabled: true, delete_request_store: filesystem }
    limits_config: { retention_period: 24h, ingestion_rate_mb: 2, ingestion_burst_size_mb: 4 }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storageClass }}
  resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: loki }
spec:
  selector: { app: loki }
  ports: [{ port: 3100, targetPort: 3100 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: loki }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: loki } }
  template:
    metadata: { labels: { app: loki } }
    spec:
      automountServiceAccountToken: false
      securityContext: { fsGroup: 10001 }
      containers:
        - name: loki
          image: grafana/loki:3.4.2
          args: [-config.file=/etc/loki/config.yaml]
          ports: [{ containerPort: 3100 }]
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: "1", memory: 512Mi } }
          readinessProbe: { httpGet: { path: /ready, port: 3100 }, initialDelaySeconds: 15 }
          volumeMounts: [{ name: config, mountPath: /etc/loki }, { name: data, mountPath: /loki }]
      volumes: [{ name: config, configMap: { name: loki-config } }, { name: data, persistentVolumeClaim: { claimName: loki-data } }]
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: alloy }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: portfolio-alloy }
rules: [{ apiGroups: [""], resources: [pods, pods/log], verbs: [get, list, watch] }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: portfolio-alloy }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: portfolio-alloy }
subjects: [{ kind: ServiceAccount, name: alloy, namespace: {{ .Release.Namespace }} }]
---
apiVersion: v1
kind: ConfigMap
metadata: { name: alloy-config }
data:
  config.alloy: |
    discovery.kubernetes "pods" {
      role = "pod"
    }
    discovery.relabel "portfolio" {
      targets = discovery.kubernetes.pods.targets
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        regex = "portfolio-.+"
        action = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label = "pod"
      }
    }
    loki.source.kubernetes "logs" {
      targets = discovery.relabel.portfolio.output
      forward_to = [loki.write.local.receiver]
    }
    loki.write "local" {
      endpoint {
        url = "http://loki:3100/loki/api/v1/push"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: alloy }
spec:
  replicas: 1
  selector: { matchLabels: { app: alloy } }
  template:
    metadata: { labels: { app: alloy } }
    spec:
      serviceAccountName: alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.7.5
          args: [run, /etc/alloy/config.alloy, --storage.path=/tmp/alloy]
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: "1", memory: 256Mi } }
          volumeMounts: [{ name: config, mountPath: /etc/alloy }]
      volumes: [{ name: config, configMap: { name: alloy-config } }]
{{- end }}