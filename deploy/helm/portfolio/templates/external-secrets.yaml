{{- if .Values.externalSecrets.enabled }}
{{- if not .Values.externalSecrets.runtimeKey }}
{{- fail "externalSecrets.runtimeKey is required when externalSecrets.enabled is true" }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.runtimeSecret }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.storeName }}
  target:
    name: {{ .Values.runtimeSecret }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.runtimeKey | quote }}
{{- end }}
