apiVersion: batch/v1
kind: Job
metadata:
  name: portfolio-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 180
  template:
    metadata: { labels: { app: portfolio-api, app.kubernetes.io/part-of: portfolio } }
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext: { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: {{ .Values.images.api | quote }}
          command: [node, services/portfolio/src/migrate.js]
          env:
            - { name: PORTFOLIO_EXPECTED_DATABASE_HOST, value: "{{ if .Values.nativeDatabase.enabled }}postgres-native.{{ .Release.Namespace }}.svc.cluster.local{{ else }}postgres.{{ .Values.dataNamespace }}.svc.cluster.local{{ end }}" }
            - name: PORTFOLIO_DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.runtimeSecret }}, key: PORTFOLIO_DATABASE_URL } }
          resources: { requests: { cpu: 25m, memory: 64Mi }, limits: { cpu: "1", memory: 256Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }