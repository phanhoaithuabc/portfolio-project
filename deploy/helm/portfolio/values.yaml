images:
  api: ghcr.io/phanhoaithuabc/portfolio-api:bootstrap
  web: ghcr.io/phanhoaithuabc/portfolio-web:bootstrap
  sourceTag: bootstrap
imagePullSecrets: []
replicas: 1
environment: lab
runtimeSecret: portfolio-runtime
externalSecrets:
  enabled: false
  storeName: aws-secretsmanager
  refreshInterval: 1h
  runtimeKey: ""
dataNamespace: portfolio-data
storageClass: local-path
media:
  storage: 2Gi
  s3Bucket: ""
  s3Region: ""
  s3Endpoint: ""
  s3Prefix: portfolio-media
nativeDatabase:
  enabled: false
  address: ""
  port: 5433
ingress:
  enabled: true
  host: phanhoaithu.io.vn
  tlsSecret: portfolio-tls
api:
  cpu: 25m
  memory: 128Mi
  memoryLimit: 384Mi
web:
  cpu: 25m
  memory: 32Mi
  memoryLimit: 96Mi
