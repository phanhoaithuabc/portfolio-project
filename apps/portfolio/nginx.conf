server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    if ($http_x_forwarded_proto = "http") { return 308 https://$host$request_uri; }
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location = /health { access_log off; return 200 'ok'; }
    location = /ready { access_log off; return 200 'ready'; }
    location /api/ {
        proxy_pass http://portfolio-api:4010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
    location /projects/ {
        proxy_pass http://portfolio-api:4010/projects/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
    location /pages/ {
        proxy_pass http://portfolio-api:4010/pages/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
    location /media/ {
        proxy_pass http://portfolio-api:4010/media/;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
    location = /sitemap.xml {
        proxy_pass http://portfolio-api:4010/sitemap.xml;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
    location / { try_files $uri $uri/ /index.html; }
}